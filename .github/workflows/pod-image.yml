name: Image du pod de secours RunPod

# Construit et pousse l'image utilisée par le pod de secours RunPod
# (voir app/engines/runpod_pod.py) vers GitHub Container Registry, à chaque
# modification d'un fichier dont elle dépend. Le worker serverless, lui, n'a
# pas besoin de ce workflow : RunPod le construit lui-même depuis le dépôt.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pod_server.py
      - requirements.txt
      - .github/workflows/pod-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # L'image part d'une base CUDA (runpod/base) et embarque ctranslate2 :
      # plusieurs Go, alors que le runner GitHub n'a qu'une quinzaine de Go
      # libres une fois ses outils préinstallés (.NET, Android, Haskell...)
      # comptés. Sans ce nettoyage, le build finit en "No space left on
      # device" avant même d'atteindre la limite de la couche applicative.
      - name: Libérer de l'espace disque sur le runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY"
          docker image prune -a -f
          df -h /

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      - name: Se connecter à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/transcription-pod:latest
            ghcr.io/${{ github.repository_owner }}/transcription-pod:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
