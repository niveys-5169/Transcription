name: Image du pod RunPod

# Construit et pousse l'image utilisée par le pod RunPod
# (voir app/engines/runpod_pod.py) vers GitHub Container Registry, à chaque
# modification d'un fichier dont elle dépend. Le worker serverless, lui, n'a
# pas besoin de ce workflow : RunPod le construit lui-même depuis le dépôt.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pod_server.py
      - requirements.txt
      - .github/workflows/pod-image.yml
  # Une PR qui touche l'image la construit aussi, pour la tester sur RunPod
  # avant fusion : elle est poussée sous `:pr-<numéro>` uniquement, jamais
  # sous `:latest` (réservé à main), pour ne pas changer l'image des pods.
  pull_request:
    paths:
      - Dockerfile
      - pod_server.py
      - requirements.txt
      - .github/workflows/pod-image.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # L'image part d'une base CUDA officielle NVIDIA et embarque WhisperX :
      # plusieurs Go, alors que le runner GitHub n'a qu'une quinzaine de Go
      # libres une fois ses outils préinstallés (.NET, Android, Haskell...)
      # comptés. Sans ce nettoyage, le build finit en "No space left on
      # device" avant même d'atteindre la limite de la couche applicative.
      - name: Libérer de l'espace disque sur le runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            "$AGENT_TOOLSDIRECTORY"
          docker image prune -a -f
          df -h /

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      # Une PR venue d'un fork ou de Dependabot n'a qu'un GITHUB_TOKEN en
      # lecture seule : l'image y est construite (vérification) sans être
      # poussée.
      - name: Se connecter à GitHub Container Registry
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/transcription-pod:latest', github.repository_owner) || '' }}
            ${{ github.event_name == 'pull_request' && format('ghcr.io/{0}/transcription-pod:pr-{1}', github.repository_owner, github.event.number) || format('ghcr.io/{0}/transcription-pod:{1}', github.repository_owner, github.sha) }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
