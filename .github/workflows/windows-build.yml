name: Application Windows

# Une version Windows fraîche est produite à chaque mise à jour de main,
# et peut aussi être relancée depuis l'onglet Actions de GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    name: Construire Transcription.exe
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-app.txt pyinstaller pytest

      - name: Exécuter les tests Python
        run: python -m pytest -q

      - name: Construire l'application
        run: |
          "BUILD_ID = '${{ github.sha }}'" | Out-File -Encoding utf8 app\build_info.py
          python -m PyInstaller packaging\transcription.spec --noconfirm

      - name: Préparer le paquet de mise à jour
        run: Compress-Archive -Path dist\Transcription\* -DestinationPath Transcription-Windows.zip

      - name: Publier l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: Transcription-Windows
          path: dist/Transcription
          if-no-files-found: error
          retention-days: 30

      - name: Publier la dernière version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload latest Transcription-Windows.zip --clobber
            gh release edit latest --target "${{ github.sha }}" --title "Dernière version"
          } else {
            gh release create latest Transcription-Windows.zip --target "${{ github.sha }}" --title "Dernière version" --notes "Mise à jour automatique."
          }
